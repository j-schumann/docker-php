on:
  push:
  workflow_dispatch:
    inputs:
      no_cache:
        description: Build without the layer cache, to get the latest base image, packages and extensions
        type: boolean
        default: true

# A newer run on the same branch replaces an older one, so an outdated build
# never overwrites the image tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Push image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata (tags, labels) for PHP
        id: phpmeta
        uses: docker/metadata-action@v6
        with:
          images: vrokdd/php
          tags: |
            type=ref,event=branch
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=auto

      - name: Build and push PHP image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ !startsWith(github.ref_name, 'renovate/') }}
          tags: ${{ steps.phpmeta.outputs.tags }}
          labels: ${{ steps.phpmeta.outputs.labels }}
          # The single-stage Dockerfile makes the inline cache of the branch's own image sufficient
          cache-from: type=registry,ref=vrokdd/php:php8
          cache-to: type=inline
          no-cache: ${{ inputs.no_cache == true }}
